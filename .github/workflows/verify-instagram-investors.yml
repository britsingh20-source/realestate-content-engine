name: Verify OliveTree Investors Instagram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-instagram-investors.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Instagram account and publishing permissions
        env:
          IG_USER_ID: ${{ secrets.INSTAGRAM_OLIVETREE_INVESTORS_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_OLIVETREE_INVESTORS_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${IG_USER_ID:-}" ] || [ -z "${IG_ACCESS_TOKEN:-}" ] || [ -z "${META_GRAPH_VERSION:-}" ]; then
            echo "Missing one or more Instagram/Meta secrets."
            exit 1
          fi

          BASE="https://graph.facebook.com/${META_GRAPH_VERSION}"

          PROFILE_JSON=$(curl -sS -G "${BASE}/${IG_USER_ID}" \
            --data-urlencode "fields=id,username,name,account_type,media_count" \
            --data-urlencode "access_token=${IG_ACCESS_TOKEN}")

          if printf '%s' "$PROFILE_JSON" | jq -e '.error' >/dev/null 2>&1; then
            echo "PROFILE_API_ERROR=$(printf '%s' "$PROFILE_JSON" | jq -r '.error.message // "unknown"')"
            exit 1
          fi

          echo "INSTAGRAM_ID=$(printf '%s' "$PROFILE_JSON" | jq -r '.id // ""')"
          echo "INSTAGRAM_USERNAME=$(printf '%s' "$PROFILE_JSON" | jq -r '.username // ""')"
          echo "INSTAGRAM_NAME=$(printf '%s' "$PROFILE_JSON" | jq -r '.name // ""')"
          echo "INSTAGRAM_ACCOUNT_TYPE=$(printf '%s' "$PROFILE_JSON" | jq -r '.account_type // ""')"
          echo "INSTAGRAM_MEDIA_COUNT=$(printf '%s' "$PROFILE_JSON" | jq -r '.media_count // ""')"

          DEBUG_JSON=$(curl -sS -G "${BASE}/debug_token" \
            --data-urlencode "input_token=${IG_ACCESS_TOKEN}" \
            --data-urlencode "access_token=${IG_ACCESS_TOKEN}")

          echo "TOKEN_VALID=$(printf '%s' "$DEBUG_JSON" | jq -r '.data.is_valid // false')"
          echo "TOKEN_TYPE=$(printf '%s' "$DEBUG_JSON" | jq -r '.data.type // ""')"
          echo "TOKEN_SCOPES=$(printf '%s' "$DEBUG_JSON" | jq -r '(.data.scopes // []) | join(" ")')"

          echo "Instagram verification succeeded. No secret values were printed."
