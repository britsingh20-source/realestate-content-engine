name: Telegram Social Publisher

on:
  workflow_dispatch:
  repository_dispatch:
    types: [telegram-content-upload]

permissions:
  contents: write

concurrency:
  group: telegram-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Process Telegram video upload
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_UPDATE_JSON: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload.update) || '' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_OLIVETREE_BUILDERS_CLIENT_ID: ${{ secrets.YOUTUBE_OLIVETREE_BUILDERS_CLIENT_ID }}
          YOUTUBE_OLIVETREE_BUILDERS_CLIENT_SECRET: ${{ secrets.YOUTUBE_OLIVETREE_BUILDERS_CLIENT_SECRET }}
          YOUTUBE_OLIVETREE_INVESTORS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OLIVETREE_INVESTORS_REFRESH_TOKEN }}
          YOUTUBE_OLIVETREE_SAFEBUY_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OLIVETREE_SAFEBUY_REFRESH_TOKEN }}
          YOUTUBE_OLIVETREE_BUILDERS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OLIVETREE_BUILDERS_REFRESH_TOKEN }}
          INSTAGRAM_OLIVETREE_INVESTORS_USER_ID: ${{ secrets.INSTAGRAM_OLIVETREE_INVESTORS_USER_ID }}
          INSTAGRAM_OLIVETREE_INVESTORS_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_OLIVETREE_INVESTORS_ACCESS_TOKEN }}
          INSTAGRAM_OLIVETREE_SAFEBUY_USER_ID: ${{ secrets.INSTAGRAM_OLIVETREE_SAFEBUY_USER_ID }}
          INSTAGRAM_OLIVETREE_SAFEBUY_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_OLIVETREE_SAFEBUY_ACCESS_TOKEN }}
          INSTAGRAM_OLIVETREE_BUILDERS_USER_ID: ${{ secrets.INSTAGRAM_OLIVETREE_BUILDERS_USER_ID }}
          INSTAGRAM_OLIVETREE_BUILDERS_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_OLIVETREE_BUILDERS_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
        run: npm run telegram:publish
      - name: Persist publish state
        if: always()
        run: |
          git config user.name "realestate-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Telegram publish state"
            git pull --rebase origin main
            git push origin main
          fi
