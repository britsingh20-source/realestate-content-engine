name: Telegram Social Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: realestate-content-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - name: Process Telegram video uploads
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_INVESTMENT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_INVESTMENT_REFRESH_TOKEN }}
          YOUTUBE_DOCUMENTATION_REFRESH_TOKEN: ${{ secrets.YOUTUBE_DOCUMENTATION_REFRESH_TOKEN }}
          YOUTUBE_LAND_SELECTION_REFRESH_TOKEN: ${{ secrets.YOUTUBE_LAND_SELECTION_REFRESH_TOKEN }}
          YOUTUBE_CONSTRUCTION_REFRESH_TOKEN: ${{ secrets.YOUTUBE_CONSTRUCTION_REFRESH_TOKEN }}
          YOUTUBE_BUYER_EDUCATION_REFRESH_TOKEN: ${{ secrets.YOUTUBE_BUYER_EDUCATION_REFRESH_TOKEN }}
          INSTAGRAM_INVESTMENT_USER_ID: ${{ secrets.INSTAGRAM_INVESTMENT_USER_ID }}
          INSTAGRAM_INVESTMENT_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_INVESTMENT_ACCESS_TOKEN }}
          INSTAGRAM_DOCUMENTATION_USER_ID: ${{ secrets.INSTAGRAM_DOCUMENTATION_USER_ID }}
          INSTAGRAM_DOCUMENTATION_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_DOCUMENTATION_ACCESS_TOKEN }}
          INSTAGRAM_LAND_SELECTION_USER_ID: ${{ secrets.INSTAGRAM_LAND_SELECTION_USER_ID }}
          INSTAGRAM_LAND_SELECTION_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LAND_SELECTION_ACCESS_TOKEN }}
          INSTAGRAM_CONSTRUCTION_USER_ID: ${{ secrets.INSTAGRAM_CONSTRUCTION_USER_ID }}
          INSTAGRAM_CONSTRUCTION_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_CONSTRUCTION_ACCESS_TOKEN }}
          INSTAGRAM_BUYER_EDUCATION_USER_ID: ${{ secrets.INSTAGRAM_BUYER_EDUCATION_USER_ID }}
          INSTAGRAM_BUYER_EDUCATION_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_BUYER_EDUCATION_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
        run: npm run telegram:publish
      - name: Persist Telegram offset and publish state
        if: always()
        run: |
          git config user.name "realestate-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Telegram publish state"
            git pull --rebase origin main
            git push origin main
          fi
