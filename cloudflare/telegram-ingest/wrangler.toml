name = "olivetree-content-telegram-ingest"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[[kv_namespaces]]
binding = "PAIRING_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
GITHUB_REPOSITORY = "britsingh20-source/realestate-content-engine"
# TELEGRAM_CHAT_ID may be a Worker secret or variable.
# Secrets expected: TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET, GITHUB_DISPATCH_TOKEN.
